<!DOCTYPE html>
<html>
 <head>
  <title>Leaflet.zoomSVG Demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://leafletjs.com/examples/geojson/sample-geojson.js"></script>
  <link rel="stylesheet" href="../zoomSVG.css" />
  <script src="../zoomSVG.js"></script>
  <style>
	html, body { height: 100%; margin: 0; }
	#map { width: 600px; max-width: 100%; height: 400px; }
  </style>
</head>
<body>
<div id="map"></div>
<div style="margin: 6px; font-family: arial;">
 <h4>zoomSVG Basic Example (Leaflet Sample)</h4>
</div>
<script>

 var map = L.map('map',{renderer: L.zoomSVG()}).setView([39.74739, -105], 13);

 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
	attribution: "OSM", maxZoom: 23
 }).addTo(map);


 var baseballIcon = L.icon({
	iconUrl: 'https://leafletjs.com/examples/geojson/baseball-marker.png',
	iconSize: [32, 37],
	iconAnchor: [16, 37],
	popupAnchor: [0, -28]
  });
	

 function onEachFeature(feature, layer) {
	var popupContent = "<p>I started out as a GeoJSON " +
		feature.geometry.type + ", but now I'm a Leaflet <b>zoomSVG</b> vector!</p>";

	if (feature.properties && feature.properties.popupContent) {
		popupContent += feature.properties.popupContent;
	}

	layer.bindPopup(popupContent);
 }
	

 L.geoJSON([bicycleRental, campus], {

	style: function (feature) {
		return feature.properties && feature.properties.style;
	},

	onEachFeature: onEachFeature,

	pointToLayer: function (feature, latlng) {
		return L.circleMarker(latlng, {
			radius: 8,
			fillColor: "#ff7800",
			color: "#000",
			weight: 1,
			opacity: 1,
			fillOpacity: 0.8
		});
 	 }
 	 
	}).addTo(map);

 L.geoJSON(freeBus, {
	filter: function (feature, layer) {
		if (feature.properties) {
			// If the property "underConstruction" exists and is true, return false (don't render features under construction)
			return feature.properties.underConstruction !== undefined ? !feature.properties.underConstruction : true;
			}
		return false;
		},

	oEachFeature: onEachFeature
		
	}).addTo(map);

 var coorsLayer = L.geoJSON(coorsField, {

		pointToLayer: function (feature, latlng) {
			return L.marker(latlng, {icon: baseballIcon});
		},

		onEachFeature: onEachFeature
 }).addTo(map);

</script>
</body>
</html>
