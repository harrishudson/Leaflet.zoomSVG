<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Countries Higher Res Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="../zoomSVG.css" />
<script src="../zoomSVG.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  #map {
    width: 100%;
    height: 100vh;
    background: #a8d0e6;
  }

  /* Tooltip (hover) styling */
  .country-tooltip {
    background: #1f2937;
    color: #f9fafb;
    border: none;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .country-tooltip::before {
    border-top-color: #1f2937 !important;
  }

  /* Popup (click) styling */
  .leaflet-popup-content-wrapper {
    border-radius: 8px;
  }
  .country-popup h3 {
    margin: 0 0 6px 0;
    font-size: 16px;
    color: #1f2937;
  }
  .country-popup p {
    margin: 2px 0;
    font-size: 13px;
    color: #4b5563;
  }

  /* Simple legend box */
  .legend {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 1000;
    background: rgba(255,255,255,0.9);
    padding: 10px 14px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    font-size: 13px;
    color: #1f2937;
  }
  .legend span {
    display: inline-block;
    width: 14px;
    height: 14px;
    background: #4f9d69;
    border: 1px solid #276749;
    margin-right: 6px;
    vertical-align: middle;
    border-radius: 2px;
  }
</style>
</head>
<body>

<div id="map"></div>
<div class="legend"><span></span>Country. (zoomSVG - Higher Res layer. zoomAnimation=false)</div>

<script>
  const map = L.map('map', {
    worldCopyJump: true,
    renderer: L.zoomSVG(),
    zoomAnimation: false 
  }).setView([20, 0], 2);

  // Base tile layer
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // Default style for polygons
  function defaultStyle() {
    return {
      fillColor: '#4f9d69',
      weight: 1,
      opacity: 1,
      color: '#276749',
      fillOpacity: 0.55
    };
  }

  // Highlight style on hover
  function highlightStyle() {
    return {
      weight: 2,
      color: '#f97316',
      fillColor: '#fbbf24',
      fillOpacity: 0.75
    };
  }

  let geojsonLayer;
  let hoveredLayer = null;

  // Reset every layer's style and close its tooltip.
  // Called defensively so a missed mouseout (common with fast mouse
  // movement) can never leave a stale highlight/tooltip behind.
  function clearAllHighlights() {
    if (!geojsonLayer) return;
    geojsonLayer.eachLayer(l => {
      geojsonLayer.resetStyle(l);
      l.closeTooltip();
    });
    hoveredLayer = null;
  }

  function highlightFeature(e) {
    const layer = e.target;

    // Self-heal: clear any previously highlighted layer first, in case
    // its mouseout never fired.
    if (hoveredLayer && hoveredLayer !== layer) {
      geojsonLayer.resetStyle(hoveredLayer);
      hoveredLayer.closeTooltip();
    }

    hoveredLayer = layer;
    layer.setStyle(highlightStyle());
    layer.bringToFront();
  }

  function resetHighlight(e) {
    const layer = e.target;
    geojsonLayer.resetStyle(layer);
    if (hoveredLayer === layer) {
      hoveredLayer = null;
    }
  }

  function zoomToFeature(e) {
    map.fitBounds(e.target.getBounds());
  }

  // Attach tooltip, popup, and interactivity to each feature
  function onEachFeature(feature, layer) {
    const props = feature.properties || {};

    // Try common property name variants used in countries.geo.json files
    const name = props.name || props.ADMIN || props.NAME || 'Unknown';

    // Tooltip - shown on hover, follows the mouse
    layer.bindTooltip(name, {
      className: 'country-tooltip',
      sticky: true
    });

    // Popup - shown on click, with a bit more detail
    const popupHtml = `
      <div class="country-popup">
        <h3>${name}</h3>
        ${props.iso_a3 ? `<p><strong>ISO A3:</strong> ${props.iso_a3}</p>` : ''}
        ${props.continent ? `<p><strong>Continent:</strong> ${props.continent}</p>` : ''}
        ${props.pop_est ? `<p><strong>Population (est):</strong> ${Number(props.pop_est).toLocaleString()}</p>` : ''}
      </div>
    `;
    layer.bindPopup(popupHtml);

    layer.on({
      mouseover: highlightFeature,
      mouseout: resetHighlight,
      click: zoomToFeature
    });
  }

  // Load the GeoJSON file
  // See Source: https://github.com/datasets/geo-countries/blob/main/data/countries.geojson
  fetch('https://raw.githubusercontent.com/datasets/geo-countries/refs/heads/main/data/countries.geojson', {mode: 'cors'})
    .then(res => {
      if (!res.ok) throw new Error('Could not load countries.geo.json (status ' + res.status + ')');
      return res.json();
    })
    .then(data => {
      geojsonLayer = L.geoJSON(data, {
        style: defaultStyle,
        onEachFeature: onEachFeature
      }).addTo(map);

      map.fitBounds(geojsonLayer.getBounds());

      // Safety net: if the pointer leaves the map entirely (fast flick
      // off the edge), make sure nothing is left highlighted.
      map.getContainer().addEventListener('mouseleave', clearAllHighlights);
    })
    .catch(err => {
      console.error(err);
      document.getElementById('map').insertAdjacentHTML(
        'afterbegin',
        `<div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);
                     background:#fee2e2;color:#991b1b;padding:10px 16px;border-radius:6px;
                     z-index:2000;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.2);">
           Failed to load countries.geo.json — make sure it's in the same folder as this HTML file
           and that you're viewing this via a local web server (not double-clicked as file://).
         </div>`
      );
    });
</script>

</body>
</html>
